name: Plugin QA

on:
  push:
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
